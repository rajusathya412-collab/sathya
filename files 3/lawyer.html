<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawyer dashboard - NyayaConnect AI</title>
<style>
:root{--navy:#0b2447;--blue:#e8f1fb;--ink:#14213d;--line:#d5deea;--bg:#fff;--accent:#1d5fb8;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--navy:#9cc3f5;--blue:#14243d;--ink:#e6edf7;--line:#2a3d5a;--bg:#0c1524;--accent:#6aa8f0;--ok:#5fcf8a}}
*{box-sizing:border-box}body{margin:0;padding:24px 5vw;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1{color:var(--navy);margin:0 0 4px}h2{font-size:17px;color:var(--navy);margin:24px 0 8px}
.c{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.c.v{border-color:var(--ok)}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
label{display:block;font-size:13px;margin-top:8px}textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:transparent;color:inherit;font:inherit}
button{margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{font-size:13px;padding:1px 8px;border-radius:99px;background:var(--blue)}.small{font-size:14px;opacity:.8}
</style></head><body>
<h1>Lawyer dashboard</h1><p class="small">AI-generated intake summaries. Review and correct each one, then mark it verified. These are not legal opinions. <a href="/">Back to client chat</a></p>
<h2>Case briefs</h2><div id="cases"></div><h2>Appointments</h2><div id="bk"></div>
<script>
const $=id=>document.getElementById(id);const H=()=>({'x-passcode':sessionStorage.getItem('pc')||''});
function mk(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function field(lbl,val){const l=mk('label','',lbl),t=mk('textarea');t.value=val;l.append(t);return[l,t]}
async function load(){const res=await fetch('/api/cases',{headers:H()});
 if(res.status===401){const pw=prompt('Lawyer passcode');if(pw){sessionStorage.setItem('pc',pw);return load()}$('cases').replaceChildren(mk('p','small','A passcode is required to view cases.'));return}
 const db=await res.json();$('cases').replaceChildren();$('bk').replaceChildren();
 if(!db.cases.length)$('cases').append(mk('p','small','No cases yet. Complete an intake in the client chat and it will appear here.'));
 db.cases.slice().reverse().forEach(c=>{const d=mk('div','c'+(c.status.startsWith('verified')?' v':''));
  const h=mk('div','h');h.append(mk('span','',c.case_id+' · '+c.category),mk('span','tag',c.urgency+' · '+c.client_language+' · '+c.status));
  const[ls,ts]=field('Summary',c.summary),[lf,tf]=field('Facts (one per line)',c.facts.join('\n')),[lm,tm]=field('Missing information (one per line)',c.missing_info.join('\n'));
  const b=mk('button','','Save and verify');b.onclick=async()=>{const lines=t=>t.value.split('\n').map(x=>x.trim()).filter(Boolean);
   await fetch('/api/cases/'+c.case_id+'/verify',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({summary:ts.value,facts:lines(tf),missing_info:lines(tm)})});load()};
  d.append(h,ls,lf,lm,b);$('cases').append(d)});
 if(!db.bookings.length)$('bk').append(mk('p','small','No appointments booked yet.'));
 db.bookings.forEach(b=>$('bk').append(mk('div','c',b.booking_id+' · '+b.lawyer+' · '+b.slot+' · case '+b.case_id)))}
load();
</script></body></html>
